<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Recycle VQA project overview</title><desc id="desc">PROJECT SUMMARY · 공개 대회 기록 기반 시각화 · 실행 화면 아님. 이미지와 질문의 오답을 분석하고, 다시 확인할 문항을 선별합니다.</desc><rect width="1440" height="900" fill="#f5f7f9"/><rect width="1440" height="10" fill="#087e67"/><g font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,Segoe UI,sans-serif"><text x="64" y="90" font-size="27" fill="#202730" font-weight="750">Recycle VQA</text><text x="760" y="90" font-size="14" fill="#687583" font-weight="400">MULTIMODAL AI / ERROR ANALYSIS</text><path d="M64 114H1376" stroke="#ced6dd"/><text x="64" y="197" font-size="47" fill="#202730" font-weight="750">Compare. Diagnose. Re-infer.</text><text x="64" y="245" font-size="22" fill="#546171" font-weight="400">이미지와 질문의 오답을 분석하고, 다시 확인할 문항을 선별합니다.</text><rect x="64" y="284" width="411" height="278" rx="6" fill="white" stroke="#d5dde5"/><path d="M64 286H475" stroke="#087e67" stroke-width="4"/><text x="90" y="327" font-size="14" fill="#087e67" font-weight="750">MODEL COMPARISON</text><text x="422" y="327" font-size="14" fill="#087e67" font-weight="750">01</text><text x="90" y="390" font-size="27" fill="#202730" font-weight="750">Qwen + InternVL</text><text x="90" y="445" font-size="18" fill="#566471" font-weight="400">예측 로그 비교</text><text x="90" y="485" font-size="17" fill="#566471" font-weight="400">모델별 취약 문항 확인</text><text x="485" y="438" font-size="26" fill="#9ba8b4" font-weight="400">→</text><rect x="514" y="284" width="411" height="278" rx="6" fill="white" stroke="#d5dde5"/><path d="M514 286H925" stroke="#087e67" stroke-width="4"/><text x="540" y="327" font-size="14" fill="#087e67" font-weight="750">ERROR TAXONOMY</text><text x="872" y="327" font-size="14" fill="#087e67" font-weight="750">02</text><text x="540" y="390" font-size="27" fill="#202730" font-weight="750">질문 유형별 분석</text><text x="540" y="445" font-size="18" fill="#566471" font-weight="400">개수 · 위치 · 재질 · 분리배출</text><text x="540" y="485" font-size="17" fill="#566471" font-weight="400">취약 유형과 신뢰도 점검</text><text x="935" y="438" font-size="26" fill="#9ba8b4" font-weight="400">→</text><rect x="964" y="284" width="411" height="278" rx="6" fill="white" stroke="#d5dde5"/><path d="M964 286H1375" stroke="#087e67" stroke-width="4"/><text x="990" y="327" font-size="14" fill="#087e67" font-weight="750">TEAM PIPELINE</text><text x="1322" y="327" font-size="14" fill="#087e67" font-weight="750">03</text><text x="990" y="390" font-size="27" fill="#202730" font-weight="750">선택적 재추론</text><text x="990" y="445" font-size="18" fill="#566471" font-weight="400">객체 재탐색 · 결과 통합</text><text x="990" y="485" font-size="17" fill="#566471" font-weight="400">기준 수립 기여 / 최종 통합은 팀 성과</text><path d="M64 600H1376M64 720H1376M501 625V695M938 625V695" stroke="#ced6dd"/><text x="64" y="661" font-size="39" fill="#087e67" font-weight="750">1 / 193</text><text x="64" y="696" font-size="14" fill="#61707f" font-weight="400">TEAM RANK</text><text x="514" y="661" font-size="39" fill="#087e67" font-weight="750">0.97635</text><text x="514" y="696" font-size="14" fill="#61707f" font-weight="400">PRIVATE SCORE</text><text x="964" y="661" font-size="39" fill="#087e67" font-weight="750">0.96452</text><text x="964" y="696" font-size="14" fill="#61707f" font-weight="400">PUBLIC SCORE</text><text x="64" y="860" font-size="15" fill="#687583" font-weight="400">PROJECT SUMMARY · 공개 대회 기록 기반 시각화 · 실행 화면 아님</text></g></svg>
